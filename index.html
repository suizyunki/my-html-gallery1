<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>記憶の傾斜 — Slope of Memory</title>

  <!-- Google Fonts: 段階的におどろおどろしく変化する和文・欧文書体群 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Kaisei+Opti:wght@700&family=Shippori+Mincho:wght@400;700&family=Yuji+Boku&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">

  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    /* --------------------------------------------------
       リセット＆ベース
    -------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      width: 100%;
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Shippori Mincho', serif;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    .scroll-wrapper {
      position: relative;
      width: 100%;
      height: 600vh;
    }

    .viewport-fixed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    /* --------------------------------------------------
       画像レイヤー（スマホ時は全体が収まるようcontain設定）
    -------------------------------------------------- */
    .image-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      will-change: opacity, transform, filter;
      transition: filter 0.3s ease;
    }

    /* スマホ・縦画面：画像全体が欠けずに表示される設定 */
    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
      .image-layer {
        object-fit: contain;
      }
    }

    .image-layer:first-child {
      opacity: 1;
    }

    /* 画像未配置時のフォールバック用プレースホルダー */
    .image-layer.fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: clamp(3rem, 10vw, 8rem);
      color: rgba(255, 255, 255, 0.15);
      background: radial-gradient(circle at center, #151515 0%, #000000 100%);
    }

    /* --------------------------------------------------
       エフェクト（ノイズ・減光・走査線）
    -------------------------------------------------- */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.8) 85%, #000000 100%);
      z-index: 10;
    }

    .noise-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      z-index: 11;
      mix-blend-mode: overlay;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 12;
      opacity: 0.55;
    }

    /* --------------------------------------------------
       UIレイアウト
    -------------------------------------------------- */
    .ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 3.5vw, 40px);
      box-sizing: border-box;
    }

    /* ヘッダー */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      letter-spacing: 0.15em;
    }

    .title-block h1 {
      font-size: clamp(0.85rem, 1.8vw, 1.15rem);
      font-weight: 600;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
    }

    .title-block span {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 3px;
      letter-spacing: 0.3em;
    }

    .status-block {
      text-align: right;
      font-family: 'Cinzel', monospace;
    }

    .stage-counter {
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 800;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.2em;
      text-shadow: 0 0 10px #000;
    }

    .erosion-rate {
      font-size: clamp(0.7rem, 1.4vw, 0.85rem);
      color: rgba(255, 255, 255, 0.5);
      margin-top: 3px;
      letter-spacing: 0.15em;
      text-shadow: 0 0 10px #000;
      transition: color 0.3s ease;
    }

    .erosion-rate.critical {
      color: #ff2233;
      text-shadow: 0 0 12px rgba(255, 34, 51, 0.8), 0 0 4px #000;
      animation: blink 0.9s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* --------------------------------------------------
       キャプション領域（画面下部・サイズ1.5倍・強固な輪郭）
    -------------------------------------------------- */
    .caption-container {
      position: absolute;
      bottom: 110px; /* 画面下部に配置 */
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 840px);
      text-align: center;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .caption-container {
        bottom: 90px;
        width: 94%;
      }
    }

    .caption-item {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      opacity: 0;
      transition: opacity 0.55s ease;
      will-change: opacity, transform;
    }

    .caption-item.active {
      opacity: 1;
    }

    /* 共通文字基本（従来の1.5倍サイズ：1.5rem〜2.3rem） */
    .caption-item p {
      font-size: clamp(1.45rem, 3.6vw, 2.3rem);
      line-height: 1.65;
      margin: 0;
      /* 強固な黒い輪郭線（文字の視認性を極限まで確保） */
      -webkit-text-stroke: 1.2px #000000;
    }

    /* --- Stage 1: 日常・平穏 --- */
    .caption-1 p {
      font-family: 'Shippori Mincho', serif;
      font-weight: 600;
      color: #f7f7f7;
      letter-spacing: 0.18em;
      text-shadow: 
        0 0 12px #000, 
        2px 2px 0 #000, -2px -2px 0 #000, 
        2px -2px 0 #000, -2px 2px 0 #000, 
        0 0 25px rgba(0, 0, 0, 0.9);
    }

    /* --- Stage 2: わずかな違和感・冷気 --- */
    .caption-2 p {
      font-family: 'Zen Old Mincho', serif;
      font-weight: 700;
      color: #bfe3ec; /* 青白い冷気 */
      letter-spacing: 0.22em;
      text-shadow: 
        0 0 12px #000, 
        2px 2px 0 #000, -2px -2px 0 #000, 
        2px -2px 0 #000, -2px 2px 0 #000, 
        0 0 18px rgba(60, 160, 190, 0.55);
    }

    /* --- Stage 3: 浸食・黄濁した不穏さ --- */
    .caption-3 p {
      font-family: 'Kaisei Opti', serif;
      font-weight: 700;
      color: #e5d496; /* 淀んだ黄褐色 */
      letter-spacing: 0.26em;
      text-shadow: 
        0 0 14px #000, 
        3px 3px 0 #000, -3px -3px 0 #000, 
        3px -3px 0 #000, -3px 3px 0 #000, 
        0 0 22px rgba(180, 150, 40, 0.6);
    }

    /* --- Stage 4: 融解・呪術的な筆文字（游字ボク） --- */
    .caption-4 p {
      font-family: 'Yuji Boku', cursive, serif;
      color: #ff5e5e; /* 乾きかけた血の赤 */
      letter-spacing: 0.18em;
      text-shadow: 
        0 0 15px #000, 
        3px 3px 0 #000, -3px -3px 0 #000, 
        3px -3px 0 #000, -3px 3px 0 #000, 
        0 0 30px rgba(255, 30, 30, 0.7);
    }

    /* --- Stage 5: 崩壊・完全な狂気とグリッチ痙攣 --- */
    .caption-5 p {
      font-family: 'Yuji Boku', cursive, serif;
      color: #ff0d35; /* 毒々しい深紅 */
      letter-spacing: 0.3em;
      font-size: clamp(1.6rem, 4.2vw, 2.6rem); /* 最大化 */
      text-shadow: 
        0 0 18px #000, 
        4px 4px 0 #000, -4px -4px 0 #000, 
        4px -4px 0 #000, -4px 4px 0 #000, 
        2px 0 10px #ff0055, -2px 0 10px #00e5ff;
      animation: eerieGlitch 0.2s infinite ease-in-out alternate;
    }

    @keyframes eerieGlitch {
      0% {
        transform: translate(0, 0) skew(0deg);
        filter: drop-shadow(0 0 4px #ff0055);
      }
      50% {
        transform: translate(-1.5px, 1px) skew(-1.5deg);
        filter: drop-shadow(-3px 0 6px #00ffff);
      }
      100% {
        transform: translate(2px, -1px) skew(1deg);
        filter: drop-shadow(3px 0 8px #ff0033);
      }
    }

    /* フッター */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.35);
      text-shadow: 0 0 8px #000;
    }

    .scroll-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
    }

    .scroll-line {
      width: 32px;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    .scroll-line::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: #ffffff;
      animation: lineMove 2s infinite ease-in-out;
    }

    @keyframes lineMove {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }

    /* --------------------------------------------------
       崩壊シェイク＆再体験ボタン
    -------------------------------------------------- */
    .glitch-active {
      animation: cameraShake 0.1s infinite alternate ease-in-out;
    }

    @keyframes cameraShake {
      0% { transform: translate(0, 0) scale(1.03); }
      50% { transform: translate(-2px, 1.5px) scale(1.04); }
      100% { transform: translate(1.5px, -1.5px) scale(1.03); }
    }

    .end-prompt {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      text-align: center;
      z-index: 30;
    }

    .end-prompt.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .restart-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 40, 60, 0.6);
      color: #ff6677;
      font-family: 'Cinzel', serif;
      padding: 8px 22px;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }

    .restart-btn:hover {
      background: rgba(255, 30, 50, 0.25);
      border-color: #ff3344;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="scroll-wrapper" id="scrollWrapper">
    <div class="viewport-fixed" id="viewport">

      <!-- 画像レイヤー群 (1.PNG 〜 5.PNG) -->
      <div class="image-stage" id="imageStage">
        <img class="image-layer" src="1.PNG" alt="Phase 1" onerror="handleImageError(this, 1)">
        <img class="image-layer" src="2.PNG" alt="Phase 2" onerror="handleImageError(this, 2)">
        <img class="image-layer" src="3.PNG" alt="Phase 3" onerror="handleImageError(this, 3)">
        <img class="image-layer" src="4.PNG" alt="Phase 4" onerror="handleImageError(this, 4)">
        <img class="image-layer" src="5.PNG" alt="Phase 5" onerror="handleImageError(this, 5)">
      </div>

      <!-- シネマティックレイヤー -->
      <div class="vignette"></div>
      <div class="noise-overlay"></div>
      <div class="scanlines"></div>

      <!-- UIレイヤー -->
      <div class="ui-layer">
        <header class="header-bar">
          <div class="title-block">
            <h1>記憶の傾斜</h1>
            <span>SLOPE OF MEMORY</span>
          </div>
          <div class="status-block">
            <div class="stage-counter" id="stageCounter">1 / 5</div>
            <div class="erosion-rate" id="erosionRate">記憶の浸食率 20%</div>
          </div>
        </header>

        <!-- 画面下部キャプション（1〜5段階変化） -->
        <div class="caption-container">
          <div class="caption-item caption-1 active" data-index="0">
            <p>見慣れた日常。<br>朝の光が輪郭を穏やかにつなぎとめている。</p>
          </div>
          <div class="caption-item caption-2" data-index="1">
            <p>わずかな違和感。<br>影の落ちる角度が、記憶と合致しない。</p>
          </div>
          <div class="caption-item caption-3" data-index="2">
            <p>浸食の兆候。<br>安定した空間に、微かな歪みが生じる。</p>
          </div>
          <div class="caption-item caption-4" data-index="3">
            <p>輪郭の融解。<br>おぼろげな記憶が傾き始めた。</p>
          </div>
          <div class="caption-item caption-5" data-index="4">
            <p>記憶の崩壊。<br>ここはもう、私の知る場所ではない。</p>
          </div>
        </div>

        <footer class="footer-bar">
          <div class="scroll-indicator" id="scrollIndicator">
            <span class="scroll-line"></span>
            <span>SCROLL / SWIPE</span>
          </div>
          <div class="credit">EXHIBITION 2026</div>
        </footer>

        <!-- 最終フェーズ到達時ボタン -->
        <div class="end-prompt" id="endPrompt">
          <button class="restart-btn" onclick="scrollToTop()">RESET MEMORY</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    function handleImageError(img, stageNum) {
      const fallbackDiv = document.createElement('div');
      fallbackDiv.className = img.className + ' fallback';
      fallbackDiv.innerText = 'STAGE ' + stageNum;
      img.parentNode.replaceChild(fallbackDiv, img);
    }

    const layers = gsap.utils.toArray('.image-layer');
    const captions = gsap.utils.toArray('.caption-item');
    const stageCounter = document.getElementById('stageCounter');
    const erosionRate = document.getElementById('erosionRate');
    const viewport = document.getElementById('viewport');
    const endPrompt = document.getElementById('endPrompt');
    const scrollIndicator = document.getElementById('scrollIndicator');

    const totalStages = 5;

    // スクロールタイムライン
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: "#scrollWrapper",
        start: "top top",
        end: "bottom bottom",
        scrub: 1.2,
        onUpdate: (self) => {
          updateUI(self.progress);
        }
      }
    });

    // レイヤーのクロスフェード
    for (let i = 1; i < layers.length; i++) {
      tl.to(layers[i], {
        opacity: 1,
        ease: "power1.inOut",
        duration: 1
      }, (i - 1) * 1);

      tl.to(layers[i - 1], {
        scale: 1.05,
        filter: "blur(2px)",
        ease: "none",
        duration: 1
      }, (i - 1) * 1);
    }

    // 5.PNG 到達時の歪みエフェクト
    tl.to(layers[4], {
      scale: 1.12,
      filter: "contrast(190%) saturate(160%) hue-rotate(-25deg)",
      ease: "power2.inOut",
      duration: 0.8
    });

    // UI & キャプション更新
    function updateUI(progress) {
      const stageFloat = progress * (totalStages - 1);
      const currentIndex = Math.min(Math.floor(stageFloat + 0.35), totalStages - 1);
      const percentage = Math.min(Math.round(20 + progress * 80), 100);

      stageCounter.innerText = `${currentIndex + 1} / 5`;

      if (percentage >= 98) {
        erosionRate.innerText = `記憶の浸食率 100% [ CRITICAL ]`;
        erosionRate.classList.add('critical');
        viewport.classList.add('glitch-active');
        endPrompt.classList.add('visible');
        scrollIndicator.style.opacity = '0';
      } else {
        erosionRate.innerText = `記憶の浸食率 ${percentage}%`;
        erosionRate.classList.remove('critical');
        viewport.classList.remove('glitch-active');
        endPrompt.classList.remove('visible');
        scrollIndicator.style.opacity = '1';
      }

      captions.forEach((cap, idx) => {
        if (idx === currentIndex) {
          cap.classList.add('active');
        } else {
          cap.classList.remove('active');
        }
      });
    }

    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    window.addEventListener('resize', () => {
      ScrollTrigger.refresh();
    });
  </script>
</body>
</html>
